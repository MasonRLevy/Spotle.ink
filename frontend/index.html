<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3e9" />
    <!-- Fetched up-front so the real font is ready at first paint. Without
         this the browser only discovers the font after parsing CSS, paints
         the fallback, then swaps - the flash on refresh. -->
    <link
      rel="preload"
      href="/src/assets/BoldsPixels.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>Spotle.ink</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
